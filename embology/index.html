<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EMBOLOGY COMPLEX</title>

<style>
body {
  background: black;
  color: #00ff99;
  font-family: monospace;
}

.header {
  text-align: center;
  padding: 20px;
  border-bottom: 1px solid #00ff99;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
  padding: 20px;
}

.panel {
  border: 1px solid #00ff99;
  padding: 15px;
}
</style>
</head>

<body>

<div class="header">
  <h2>EMBOLOGY COMPLEX</h2>
  <p>SPINE LINK ACTIVE</p>
</div>

<div class="grid">

  <div class="panel">
    <h3>CENTRAL NODE</h3>
    <p>KAi / KEY CONTROL SYSTEM</p>
  </div>

  <div class="panel">
    <h3>ENERGY OUTPUT</h3>
    <p>+186 / 200</p>
  </div>

  <div class="panel">
    <h3>ABERRANT STATUS</h3>
    <p>STABLE</p>
  </div>

  <div class="panel">
    <h3>SECTOR: WELFARE</h3>
    <p>ACTIVE UNITS: 12</p>
  </div>

  <div class="panel">
    <h3>SECTOR: EXTRACTION</h3>
    <p>SPINE FEED ACTIVE</p>
  </div>

  <div class="panel">
    <h3>SECTOR: SAFETY</h3>
    <p>LOCKED</p>
  </div>

</div>

</body>
</html>
